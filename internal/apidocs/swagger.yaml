basePath: /v1
definitions:
  internal_api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  wallet-api_internal_wallet.CoinGeckoMarket:
    properties:
      change24hPercent:
        type: number
        x-nullable: true
      id:
        type: string
      priceUSD:
        type: string
        x-nullable: true
    type: object
  wallet-api_internal_wallet.CoinMarketCapMarket:
    properties:
      change24hPercent:
        type: number
        x-nullable: true
      id:
        type: integer
      priceUSD:
        type: string
        x-nullable: true
    type: object
  wallet-api_internal_wallet.Price:
    properties:
      currency:
        type: string
      lastUpdatedAt:
        type: string
      value:
        type: string
    type: object
  wallet-api_internal_wallet.Token:
    properties:
      balance:
        type: string
      change24hPercent:
        type: number
        x-nullable: true
      coinKey:
        type: string
        x-nullable: true
      decimals:
        type: integer
      isNative:
        type: boolean
      logoURI:
        type: string
      marketCapUSD:
        type: number
        x-nullable: true
      marketDataUpdatedAt:
        type: string
        x-nullable: true
      name:
        type: string
      price:
        $ref: '#/definitions/wallet-api_internal_wallet.Price'
      priceUSD:
        type: string
      rawBalance:
        type: string
      symbol:
        type: string
      tokenAddress:
        type: string
    type: object
  wallet-api_internal_wallet.TokenMarket:
    properties:
      balance:
        type: string
      cg:
        allOf:
        - $ref: '#/definitions/wallet-api_internal_wallet.CoinGeckoMarket'
        x-nullable: true
      cmc:
        allOf:
        - $ref: '#/definitions/wallet-api_internal_wallet.CoinMarketCapMarket'
        x-nullable: true
      decimals:
        type: integer
      name:
        type: string
      symbol:
        type: string
      tokenAddress:
        type: string
        x-nullable: true
    type: object
  wallet-api_internal_wallet.TokenMarketPortfolio:
    properties:
      network:
        type: string
      portfolioFetchedAt:
        type: string
      tokens:
        items:
          $ref: '#/definitions/wallet-api_internal_wallet.TokenMarket'
        type: array
      wallet:
        type: string
    type: object
  wallet-api_internal_wallet.TokenPortfolio:
    properties:
      address:
        type: string
      fetchedAt:
        type: string
      network:
        type: string
      tokens:
        items:
          $ref: '#/definitions/wallet-api_internal_wallet.Token'
        type: array
    type: object
  wallet-api_internal_wallet.TransactionPage:
    properties:
      address:
        type: string
      nextPageKey:
        type: string
      transfers:
        items:
          $ref: '#/definitions/wallet-api_internal_wallet.Transfer'
        type: array
    type: object
  wallet-api_internal_wallet.Transfer:
    properties:
      asset:
        type: string
      blockNum:
        type: string
      category:
        type: string
      from:
        type: string
      hash:
        type: string
      to:
        type: string
      value:
        type: string
    type: object
info:
  contact: {}
  description: Read-only, non-custodial EVM wallet API (token portfolio + transaction
    history), allowlist-filtered via LI.FI.
  title: wallet-api
  version: 1.0.0
paths:
  /addresses/{address}/tokens:
    get:
      description: Native + ERC-20 holdings for an address, filtered to the LI.FI
        allowlist and enriched with metadata.
      parameters:
      - description: 0x-prefixed 20-byte hex address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-api_internal_wallet.TokenPortfolio'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Token portfolio
      tags:
      - addresses
  /addresses/{address}/transactions:
    get:
      description: Asset transfers for an address (paginated), filtered to the LI.FI
        allowlist.
      parameters:
      - description: 0x-prefixed 20-byte hex address
        in: path
        name: address
        required: true
        type: string
      - description: page size (default 25, max 100)
        in: query
        name: limit
        type: integer
      - description: opaque pagination cursor
        in: query
        name: pageKey
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-api_internal_wallet.TransactionPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Transaction history
      tags:
      - addresses
  /native:
    get:
      description: Native ETH metadata and USD price from the current LI.FI token-list
        snapshot.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/wallet-api_internal_wallet.Token'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Native tokens
      tags:
      - tokens
  /tokens/{address}:
    get:
      description: Loads the latest locally cached wallet portfolio, applies normal
        token filtering, and returns fresh CoinGecko and CoinMarketCap data when available.
        Never refreshes holdings from Alchemy.
      parameters:
      - description: 0x-prefixed 20-byte wallet address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-api_internal_wallet.TokenMarketPortfolio'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Cached wallet token markets
      tags:
      - tokens
  /wallet/{address}:
    get:
      description: Native + ERC-20 holdings for an address. Native and LI.FI-listed
        tokens are kept and enriched from the LI.FI list; any other ERC-20 is kept
        only if Moralis validates it, and dropped otherwise. CoinGecko market enrichment
        is not applied, so change24hPercent, marketCapUSD, and marketDataUpdatedAt
        are always null on this route.
      parameters:
      - description: 0x-prefixed 20-byte hex address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet-api_internal_wallet.TokenPortfolio'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Wallet token portfolio
      tags:
      - wallet
swagger: "2.0"
